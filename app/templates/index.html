<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium real-time containerized visitor counter application built with Flask, Redis, and Docker.">
    <title>Visitor Dashboard - Production Counter</title>
    
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background Decorative Gradients -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="container">
        <!-- Premium Glassmorphic Card -->
        <section class="card" id="counter-card">
            <header class="card-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                        <path d="m12 3-1.912 5.886a1 1 0 0 1-.95.686H2.946l4.82 3.51a1 1 0 0 1 .366 1.117L6.282 20l4.816-3.516a1 1 0 0 1 1.182 0L17.096 20l-1.85-5.801a1 1 0 0 1 .366-1.117l4.82-3.51h-6.192a1 1 0 0 1-.95-.686L12 3Z"/>
                    </svg>
                    <span>METRIC ENGINE</span>
                </div>
                {% if error %}
                <span class="status-badge status-offline" id="status-badge">
                    <span class="pulse-dot"></span> Offline
                </span>
                {% else %}
                <span class="status-badge status-online" id="status-badge">
                    <span class="pulse-dot"></span> Live
                </span>
                {% endif %}
            </header>

            <div class="card-body">
                <h1 class="title">Production Visitor Desk</h1>
                <p class="subtitle">High-performance real-time telemetry counter backed by Redis</p>

                <!-- Glowing Number Display -->
                <div class="counter-display" id="counter-display-wrapper">
                    <span class="counter-value" id="counter-value">{{ count }}</span>
                    <span class="counter-label">TOTAL VISITS RECORDED</span>
                </div>

                {% if error %}
                <div class="error-banner" id="error-banner">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon">
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
                    </svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}
            </div>

            <footer class="card-footer">
                <button type="button" class="btn btn-primary" id="btn-increment">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                        <path d="M5 12h14"/><path d="M12 5v14"/>
                    </svg>
                    <span>Record Visit</span>
                </button>
                <button type="button" class="btn btn-secondary" id="btn-sync">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon sync-icon">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M16 3h5v5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 21H3v-5"/>
                    </svg>
                    <span>Sync</span>
                </button>
            </footer>
        </section>

        <!-- Technical Metadata -->
        <footer class="app-info">
            <span>Server environment: <strong>Production</strong></span>
            <span class="separator">•</span>
            <span>App Node: <strong>Gunicorn-WSGI</strong></span>
        </footer>
    </main>

    <!-- Custom Interactivity Script -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
